<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiss — Issue Tracker</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand brand-logo" href="#" onclick="app.navigateHome(event)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-layers-fill me-2 text-primary" viewBox="0 0 16 16">
          <path d="M7.765 1.559a.5.5 0 0 1 .47 0l7.5 4a.5.5 0 0 1 0 .882l-7.5 4a.5.5 0 0 1-.47 0l-7.5-4a.5.5 0 0 1 0-.882z"/>
          <path d="m2.125 8.567-1.86.992a.5.5 0 0 0 0 .882l7.5 4a.5.5 0 0 0 .47 0l7.5-4a.5.5 0 0 0 0-.882l-1.86-.992-5.17 2.756a1.5 1.5 0 0 1-1.41 0z"/>
        </svg>
        HISS <span>TRACKER</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" onclick="app.navigateHome(event)">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="app.openManageLabelsModal(event)">Labels</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <span class="badge text-bg-secondary font-monospace" id="appVersionBadge">v...</span>
          <div class="btn-group btn-group-sm">
            <a href="/healthz" target="_blank" class="btn btn-outline-secondary" title="Health Check">/healthz</a>
            <a href="/readyz" target="_blank" class="btn btn-outline-secondary" title="Readiness Check">/readyz</a>
            <a href="/version" target="_blank" class="btn btn-outline-secondary" title="Version">/version</a>
            <a href="/api/v1/projects" target="_blank" class="btn btn-outline-secondary" title="Projects API">/api/v1/projects</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Global Alert Container -->
  <div class="container-fluid px-4 pt-3" id="alertContainer"></div>

  <!-- Main View Container -->
  <main class="container-fluid px-4 py-3" id="mainContainer">
    <!-- Dynamic Views loaded here by app.js -->
  </main>

  <!-- Create Project Modal -->
  <div class="modal fade modal-custom" id="createProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create Project</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="createProjectForm" onsubmit="app.handleCreateProject(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label for="projectKeyInput" class="form-label">Project Key</label>
              <input type="text" class="form-control form-control-dark" id="projectKeyInput" placeholder="e.g. ENG, HISS, INFRA" required>
              <div class="form-text text-muted">Unique short uppercase identifier.</div>
            </div>
            <div class="mb-3">
              <label for="projectNameInput" class="form-label">Project Name</label>
              <input type="text" class="form-control form-control-dark" id="projectNameInput" placeholder="e.g. Engineering Core" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Create Issue Modal -->
  <div class="modal fade modal-custom" id="createIssueModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create Issue in <span id="createIssueProjectKey"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="createIssueForm" onsubmit="app.handleCreateIssue(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label for="issueTitleInput" class="form-label">Title</label>
              <input type="text" class="form-control form-control-dark" id="issueTitleInput" placeholder="Issue title" required>
            </div>
            <div class="mb-3">
              <label for="issueDescriptionInput" class="form-label">Description</label>
              <textarea class="form-control form-control-dark" id="issueDescriptionInput" rows="3" placeholder="Detailed description (optional)"></textarea>
            </div>
            <div class="mb-3">
              <label for="issuePrioritySelect" class="form-label">Priority</label>
              <select class="form-select form-select-dark" id="issuePrioritySelect">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Issue</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Manage Labels Modal -->
  <div class="modal fade modal-custom" id="manageLabelsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Labels</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="createLabelForm" class="d-flex gap-2 mb-3" onsubmit="app.handleCreateLabel(event)">
            <input type="text" class="form-control form-control-dark" id="newLabelNameInput" placeholder="New label name (e.g. bug, frontend)" required>
            <button type="submit" class="btn btn-primary text-nowrap">Add Label</button>
          </form>
          <h6>Existing Labels</h6>
          <div id="labelsListContainer" class="d-flex flex-wrap gap-2 py-2">
            <!-- Labels list rendered here -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
