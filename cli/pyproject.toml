[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hiss-cli"
version = "0.1.0"
description = "hiss CLI — Typer + httpx client for the hiss API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.24.0",
    "rich>=13.0.0",
]

[project.scripts]
hiss = "hiss.main:app"

[tool.setuptools]
packages = ["hiss"]
