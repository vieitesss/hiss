name: CD — staging

# Safety invariant: this workflow deploys only owner-controlled Release Tag pushes.
# Never add pull_request: untrusted fork code must not execute on the self-hosted runner.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-snapshot'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve staging image tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set Release Tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push staging image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/vieitesss/hiss:${{ needs.prepare.outputs.tag }}

  deploy:
    name: Deploy staging
    needs:
      - prepare
      - build
    runs-on: [self-hosted]
    timeout-minutes: 15
    environment:
      name: staging
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Pull staging image
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/staging.env -p hiss-staging pull
      - name: Start staging services
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/staging.env -p hiss-staging up -d

  smoke-test:
    name: Smoke test staging
    needs:
      - prepare
      - deploy
    runs-on: [self-hosted]
    timeout-minutes: 5
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      BASE_URL: http://localhost:8002
    steps:
      - name: Check staging probes and version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/healthz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/readyz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/version" \
            | jq --exit-status --arg expected "$DEPLOY_TAG" '.version == $expected' >/dev/null
